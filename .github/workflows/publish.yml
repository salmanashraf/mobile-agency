name: Publish to npm

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.1, v1.1.0, v2.0.0, etc.

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Read package version
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check whether version already exists
        id: npm
        run: |
          NAME="${{ steps.package.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag prerelease
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "GitHub ref name is empty; cannot create release."
            exit 1
          fi

          PREVIOUS_TAG="$(gh release list --repo "$REPO" --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$TAG\") | .tagName" | head -n 1)"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > release-notes.md
          else
            gh api "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body' > release-notes.md
          fi

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          RELEASE_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"

          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -F draft=false \
              -F prerelease="$PRERELEASE" \
              -f body="$(cat release-notes.md)" \
              >/dev/null
          else
            gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TAG" \
              -F draft=false \
              -F prerelease="$PRERELEASE" \
              -f make_latest=false \
              -f body="$(cat release-notes.md)" \
              >/dev/null
          fi
